name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Build APK
        run: ./gradlew :android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shadow-mission-apk
          path: android/build/outputs/apk/debug/*.apk

      # Keeps one "latest" pre-release with the newest APK, easy to open from a phone.
      - name: Publish latest APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/build/outputs/apk/debug/android-debug.apk shadow-mission.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest shadow-mission.apk \
            --prerelease \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Download shadow-mission.apk on your phone to install."
